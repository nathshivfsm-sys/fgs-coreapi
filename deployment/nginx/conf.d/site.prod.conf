upstream user_service {
    least_conn;
    zone user_service 128k;
    server user-service:5001 max_fails=3 fail_timeout=10s;
    keepalive 128;
}

upstream platform_service {
    least_conn;
    zone platform_service 128k;
    server platform-service:5002 max_fails=3 fail_timeout=10s;
    keepalive 128;
}

upstream workorder_service {
    least_conn;
    zone workorder_service 128k;
    server workorder-service:5003 max_fails=3 fail_timeout=10s;
    keepalive 128;
}

server {
    listen 80;
    server_name fgs.example.com;

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name fgs.example.com;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req zone=api_rate_limit burst=60 nodelay;
    limit_conn addr_conn_limit 100;

    if ($bad_request_uri) {
        return 444;
    }

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = /api/auth {
        return 308 /api/auth/;
    }

    location /api/auth/ {
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/auth;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/invite {
        return 308 /api/invite/;
    }

    location /api/invite/ {
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/invite;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location /api/dashboard {
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/dashboard;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/signup {
        return 308 /api/signup/;
    }

    location /api/signup/ {
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/signup;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/users {
        return 308 /api/users/;
    }

    location /api/users/ {
        rewrite ^/api/users/?(.*)$ /api/$1 break;
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/users;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/platform {
        return 308 /api/platform/;
    }

    location /api/platform/ {
        rewrite ^/api/platform/?(.*)$ /api/$1 break;
        proxy_pass http://platform_service;
        proxy_set_header X-Forwarded-Prefix /api/platform;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/workorders {
        return 308 /api/workorders/;
    }

    location /api/workorders/ {
        rewrite ^/api/workorders/?(.*)$ /$1 break;
        proxy_pass http://workorder_service;
        proxy_set_header X-Forwarded-Prefix /api/workorders;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }
}
