upstream user_service {
    least_conn;
    server user-service:5001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream workorder_service {
    least_conn;
    server workorder-service:5003 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($bad_request_uri) {
        return 444;
    }

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = / {
        default_type text/plain;
        return 200 'FGS local gateway. Use /nginx-health, /api/users/, or /api/workorders/ (see deployment/nginx/README.md).';
    }

    location = /api/users {
        return 308 /api/users/;
    }

    location /api/users/ {
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=api_rate_limit burst=30 nodelay;
        limit_conn addr_conn_limit 40;
        rewrite ^/api/users/?(.*)$ /$1 break;
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/users;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/workorders {
        return 308 /api/workorders/;
    }

    location /api/workorders/ {
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=api_rate_limit burst=30 nodelay;
        limit_conn addr_conn_limit 40;
        rewrite ^/api/workorders/?(.*)$ /$1 break;
        proxy_pass http://workorder_service;
        proxy_set_header X-Forwarded-Prefix /api/workorders;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }
}
