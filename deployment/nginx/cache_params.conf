proxy_cache api_cache;
proxy_cache_methods GET HEAD;
proxy_cache_key "$scheme$request_method$host$request_uri";
proxy_cache_valid 200 301 302 10m;
proxy_cache_valid 404 1m;
proxy_cache_bypass $http_authorization $arg_nocache $http_cache_control $http_pragma;
proxy_no_cache $skip_non_get_cache $http_authorization $arg_nocache $http_cache_control $http_pragma;

add_header X-Cache-Status $upstream_cache_status always;
add_header Cache-Control "public, max-age=60, stale-while-revalidate=30" always;
