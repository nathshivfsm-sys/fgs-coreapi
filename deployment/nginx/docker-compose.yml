name: fgs-local

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      user-service:
        condition: service_healthy
      workorder-service:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
      - ./cache:/var/cache/nginx
    networks:
      - fgs-private
      # Host port publishing is ignored for containers attached only to internal
      # networks (moby#36174). Edge network exists solely so 8080/8443 bind on Windows.
      - fgs-edge
    restart: unless-stopped

  user-service:
    build:
      context: ../..
      dockerfile: deployment/nginx/docker/user-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__FgsUser: Host=postgres;Port=5432;Database=fgs_user;Username=fgs;Password=fgs_dev_password
    expose:
      - "5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fgs-private
    restart: unless-stopped

  workorder-service:
    build:
      context: ../..
      dockerfile: deployment/nginx/docker/workorder-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5003
      ConnectionStrings__FgsWorkOrder: Host=postgres;Port=5432;Database=fgs_workorder;Username=fgs;Password=fgs_dev_password
    expose:
      - "5003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fgs-private
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fgs
      POSTGRES_PASSWORD: fgs_dev_password
      POSTGRES_DB: fgs_gateway
    volumes:
      - fgs-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init-postgres.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fgs -d fgs_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fgs-private
    restart: unless-stopped

networks:
  fgs-private:
    driver: bridge
    internal: true
  fgs-edge:
    driver: bridge

volumes:
  fgs-postgres-data:
