name: fgs-local

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fgs
      RABBITMQ_DEFAULT_PASS: fgsdevlocal
      # Avoid .erlang.cookie EACCES on Windows: tmpfs must be owned by rabbitmq (uid 100, gid 101).
      RABBITMQ_ERLANG_COOKIE: fgs-local-dev-cookie
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    tmpfs:
      - /var/lib/rabbitmq:rw,nosuid,nodev,noexec,uid=100,gid=101,mode=0700
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - fgs-private
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      user-service:
        condition: service_healthy
      platform-service:
        condition: service_healthy
      workorder-service:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
      - ./cache:/var/cache/nginx
    networks:
      - fgs-private
      - fgs-edge
    restart: unless-stopped

  user-service:
    build:
      context: ../..
      dockerfile: deployment/nginx/docker/user-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__HostName: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../../src/UserService/Fgs.User.API/appsettings.json:/app/appsettings.json:ro
      - ../../src/UserService/Fgs.User.API/appsettings.Development.json:/app/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5001"
    networks:
      - fgs-private
    restart: unless-stopped

  platform-service:
    build:
      context: ../..
      dockerfile: deployment/nginx/docker/platform-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__HostName: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../../src/PlatformService/Fgs.Platform.API/appsettings.json:/app/appsettings.json:ro
      - ../../src/PlatformService/Fgs.Platform.API/appsettings.Development.json:/app/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5002"
    networks:
      - fgs-private
    restart: unless-stopped

  workorder-service:
    build:
      context: ../..
      dockerfile: deployment/nginx/docker/workorder-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ../../src/WorkOrderService/Fgs.WorkOrder.API/appsettings.json:/app/appsettings.json:ro
      - ../../src/WorkOrderService/Fgs.WorkOrder.API/appsettings.Development.json:/app/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5003"
    networks:
      - fgs-private
    restart: unless-stopped

networks:
  fgs-private:
    driver: bridge
  fgs-edge:
    driver: bridge
