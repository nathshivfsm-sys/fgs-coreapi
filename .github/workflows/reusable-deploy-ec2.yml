# Deploy one service on EC2 via AWS Systems Manager (no SSH keys).
# Pulls the channel tag from ECR and recreates the docker-compose service.
#
# AWS auth: secrets AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, else OIDC vars.AWS_ROLE_TO_ASSUME.
# GitHub repository variable: EC2_INSTANCE_ID — target instance i-xxxxxxxx
#   (Settings → Secrets and variables → Actions → Variables; no GitHub Environment required)

name: Reusable EC2 deploy

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
    inputs:
      compose_service:
        required: true
        type: string
        description: Docker Compose service name (redis, rabbitmq, setup-service, audit-service, user-service, bff-service, notification-service, file-service, inventory-service, asset-service, crm-service, consumer-service, nginx)
      channel:
        required: true
        type: string
        description: Image channel (dev)
      github_environment:
        required: true
        type: string
        description: GitHub Environment name (dev)
      image_tag_prefix:
        required: true
        type: string
        description: ECR tag prefix (redis, rabbitmq, setup, user, bff, nginx, crm)

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.compose_service }} (${{ inputs.channel }})
    runs-on: ubuntu-latest
    steps:
      - name: Require AWS auth
        id: auth
        env:
          ROLE: ${{ vars.AWS_ROLE_TO_ASSUME }}
          ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$ACCESS_KEY" ]; then
            echo "Using IAM access keys."
            echo "use_access_keys=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$ROLE" ]; then
            echo "Using GitHub OIDC role."
            echo "use_access_keys=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set secrets AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY, or variable AWS_ROLE_TO_ASSUME."
            exit 1
          fi

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.use_access_keys == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.use_access_keys == 'false'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync EC2 host files
        if: inputs.compose_service == 'crm-service' || inputs.compose_service == 'nginx'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          FGS_DIR: ${{ vars.FGS_COMPOSE_DIR || '/opt/fgs' }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, json, os, pathlib, subprocess, time

          instance = os.environ["INSTANCE_ID"]
          region = os.environ["AWS_REGION"]
          remote_dir = os.environ["FGS_DIR"]
          if not instance:
              raise SystemExit("Set repository variable EC2_INSTANCE_ID")

          files = [
              ("deployment/aws/ec2/docker-compose.ec2.yml", f"{remote_dir}/docker-compose.ec2.yml", "0644"),
              ("deployment/aws/ec2/deploy-service.sh", f"{remote_dir}/deploy-service.sh", "0755"),
              ("deployment/aws/ec2/nginx-https-entrypoint.sh", f"{remote_dir}/nginx-https-entrypoint.sh", "0755"),
              ("deployment/aws/ec2/nginx-http-only-entrypoint.sh", f"{remote_dir}/nginx-http-only-entrypoint.sh", "0755"),
          ]

          def run_ssm(script: str) -> None:
              params_path = pathlib.Path("/tmp/fgs-ssm-params.json")
              params_path.write_text(json.dumps({"commands": [script]}), encoding="utf-8")
              command_id = subprocess.check_output(
                  [
                      "aws", "ssm", "send-command",
                      "--instance-ids", instance,
                      "--document-name", "AWS-RunShellScript",
                      "--comment", "FGS sync host file",
                      "--parameters", f"file://{params_path}",
                      "--region", region,
                      "--query", "Command.CommandId",
                      "--output", "text",
                  ],
                  text=True,
              ).strip()
              for _ in range(40):
                  time.sleep(2)
                  status = subprocess.run(
                      [
                          "aws", "ssm", "get-command-invocation",
                          "--command-id", command_id,
                          "--instance-id", instance,
                          "--region", region,
                          "--query", "Status",
                          "--output", "text",
                      ],
                      capture_output=True,
                      text=True,
                  )
                  state = (status.stdout or status.stderr or "Pending").strip()
                  if state in {"Success", "Failed", "Cancelled", "TimedOut"}:
                      if state != "Success":
                          detail = subprocess.run(
                              [
                                  "aws", "ssm", "get-command-invocation",
                                  "--command-id", command_id,
                                  "--instance-id", instance,
                                  "--region", region,
                                  "--output", "json",
                              ],
                              capture_output=True,
                              text=True,
                          )
                          raise SystemExit(detail.stdout or detail.stderr or state)
                      return
              raise SystemExit(f"Timed out waiting for SSM command {command_id}")

          run_ssm(f"sudo mkdir -p {remote_dir}/certs")
          for local, remote, mode in files:
              payload = base64.b64encode(pathlib.Path(local).read_bytes()).decode("ascii")
              staged = remote + ".b64"
              run_ssm(f"sudo rm -f '{staged}'")
              for offset in range(0, len(payload), 12000):
                  chunk = payload[offset:offset + 12000]
                  run_ssm(f"printf '%s' '{chunk}' | sudo tee -a '{staged}' >/dev/null")
              run_ssm(
                  "sudo base64 -d '{staged}' | sudo tee '{remote}' >/dev/null "
                  "&& sudo chmod {mode} '{remote}' && sudo rm -f '{staged}' "
                  "&& ls -la '{remote}'".format(staged=staged, remote=remote, mode=mode)
              )
              print(f"synced {remote}")
          PY

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMPOSE_SERVICE: ${{ inputs.compose_service }}
          CHANNEL: ${{ inputs.channel }}
          TAG_PREFIX: ${{ inputs.image_tag_prefix }}
          ECR_REPO: ${{ vars.ECR_REPO || 'fgs/dockers' }}
          FGS_DIR: ${{ vars.FGS_COMPOSE_DIR || '/opt/fgs' }}
        run: |
          set -euo pipefail

          if [ -z "$INSTANCE_ID" ]; then
            echo "::error::Set repository variable EC2_INSTANCE_ID (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

          IMAGE_TAG="${TAG_PREFIX}-${CHANNEL}"
          REMOTE_CMD="sudo ${FGS_DIR}/deploy-service.sh ${COMPOSE_SERVICE} ${CHANNEL} ${ECR_REPO} ${AWS_REGION}"

          echo "Instance=$INSTANCE_ID Service=$COMPOSE_SERVICE ImageTag=$IMAGE_TAG"
          echo "Remote: $REMOTE_CMD"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "FGS deploy ${COMPOSE_SERVICE} ${IMAGE_TAG}" \
            --parameters "commands=[\"${REMOTE_CMD}\"]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM CommandId=$COMMAND_ID"

          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM deploy failed ($STATUS)"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          FINAL=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          if [ "$FINAL" != "Success" ]; then
            echo "::error::SSM deploy did not complete in time (status: $FINAL)"
            exit 1
          fi

          {
            echo "### Deploy ${COMPOSE_SERVICE}"
            echo "- Channel: \`${CHANNEL}\`"
            echo "- EC2 instance: \`${INSTANCE_ID}\`"
            echo "- Compose service: \`${COMPOSE_SERVICE}\`"
            echo "- Expected ECR tag: \`${ECR_REPO}:${IMAGE_TAG}\`"
            echo "- Method: SSM → deploy-service.sh"
          } >> "$GITHUB_STEP_SUMMARY"
