# Starts only when the gateway VERSION file changes.
# CI: build on PR; push image on merge to dev|test|main.
# CD: auto-deploy to ECS on GitHub Environment `dev`; `qa`/`prod` wait for approval.
name: Build nginx

on:
  push:
    branches: [dev, test, main]
    paths:
      - "src/Gateway/VERSION"
      - ".github/workflows/build-nginx.yml"
      - ".github/workflows/reusable-build-service.yml"
      - ".github/workflows/reusable-deploy-ecs.yml"
  pull_request:
    branches: [dev, test, main]
    paths:
      - "src/Gateway/VERSION"
      - ".github/workflows/build-nginx.yml"
      - ".github/workflows/reusable-build-service.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if VERSION did not change
        type: boolean
        default: false
      push_to_ecr:
        description: Also push image to ECR (normally only on merge to dev/test/main)
        type: boolean
        default: false

concurrency:
  group: build-nginx-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build-service.yml
    with:
      service: nginx
      context: src/Gateway
      dockerfile: src/Gateway/Dockerfile.prod
      ecr_repository: ${{ vars.ECR_REPO || 'fgs/dockers' }}
      version_file: src/Gateway/VERSION
      version_kind: plain
      test_project: ""
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      push_to_ecr: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_ecr || false }}
      caller_event: ${{ github.event_name }}
    secrets: inherit

  deploy:
    needs: build
    if: needs.build.outputs.image_pushed == 'true'
    uses: ./.github/workflows/reusable-deploy-ecs.yml
    with:
      ecs_service: gateway
      image_tag_prefix: nginx
      channel: ${{ needs.build.outputs.channel }}
      github_environment: ${{ needs.build.outputs.github_environment }}
      ecs_cluster: ${{ needs.build.outputs.ecs_cluster }}
    secrets: inherit
