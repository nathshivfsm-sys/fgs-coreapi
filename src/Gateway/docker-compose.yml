    volumes:
      - ../ServiceAgreementService/Fgs.ServiceAgreement.API/appsettings.json:/src/src/ServiceAgreementService/Fgs.ServiceAgreement.API/appsettings.json:ro
      - ../ServiceAgreementService/Fgs.ServiceAgreement.API/appsettings.Development.json:/src/src/ServiceAgreementService/Fgs.ServiceAgreement.API/appsettings.Development.json:ro
    expose:
      - "5016"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5016/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  communication-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/communication-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-communication-service
      CredentialConsumer__RequiredProviders__0: DATABASE
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../CommunicationService/Fgs.Communication.API/appsettings.json:/src/src/CommunicationService/Fgs.Communication.API/appsettings.json:ro
      - ../CommunicationService/Fgs.Communication.API/appsettings.Development.json:/src/src/CommunicationService/Fgs.Communication.API/appsettings.Development.json:ro
    expose:
      - "5017"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5017/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Tier 3 — messaging workers
  publisher-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/publisher-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-publisher-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: RABBITMQ
      RabbitMq__HostName: rabbitmq
      UserService__BaseUrl: http://user-service:5001
    depends_on:
      rabbitmq:
        condition: service_healthy
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    volumes:
      - ../PublisherService/Fgs.Publisher.API/appsettings.json:/src/src/PublisherService/Fgs.Publisher.API/appsettings.json:ro
      - ../PublisherService/Fgs.Publisher.API/appsettings.Development.json:/src/src/PublisherService/Fgs.Publisher.API/appsettings.Development.json:ro
    expose:
      - "5006"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5006/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  consumer-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/consumer-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-consumer-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: RABBITMQ
      NotificationService__BaseUrl: http://notification-service:5002
      UserService__BaseUrl: http://user-service:5001
      RabbitMq__HostName: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    volumes:
      - ../ConsumerService/Fgs.Consumer.API/appsettings.json:/src/src/ConsumerService/Fgs.Consumer.API/appsettings.json:ro
      - ../ConsumerService/Fgs.Consumer.API/appsettings.Development.json:/src/src/ConsumerService/Fgs.Consumer.API/appsettings.Development.json:ro
    expose:
      - "5007"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5007/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Tier 4 — public gateway
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      scheduling-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
      asset-service:
        condition: service_healthy
      service-agreement-service:
        condition: service_healthy
      communication-service:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
      - ./cache:/var/cache/nginx
    networks:
      - fgs-private
      - fgs-edge
    restart: unless-stopped

networks:
  fgs-private:
    driver: bridge
  fgs-edge:
    driver: bridge

volumes:
  rabbitmq-data:
