name: fgs-local

# Local Docker Desktop ONLY — not for EC2/AWS.
# EC2 dev host: deployment/aws/ec2/docker-compose.ec2.yml (project fgs-ec2, ECR images, /opt/fgs).
# See src/Gateway/README.md and deployment/aws/ec2/README.md
#
# Startup order:
#   1. rabbitmq, redis
#   2. setup-service  ? credential authority
#   3. audit-service starts first among consumers, then other credential consumers
#   4. consumer — messaging worker
#   5. nginx — public gateway after upstream health checks pass

x-service-network: &service-network
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - fgs-private
  restart: unless-stopped

# Testing: Datadog logs-only for setup-service + user-service; off for all other APIs.
# No agent/OTLP — Serilog ships logs via Datadog Logs API when DD_API_KEY (or credential ApiKey) is set.
x-datadog-env-on: &datadog-env-on
  Datadog__Enabled: "true"
  Datadog__ApiKey: ${DD_API_KEY:-}
  Datadog__Site: ${DD_SITE:-datadoghq.com}
  Datadog__AgentHost: ""
  Datadog__AgentPort: "8126"
  Datadog__DogStatsDPort: "8125"
  Datadog__Env: ${DD_ENV:-local}
  Datadog__Version: ${DD_VERSION:-0.0.0}
  Datadog__EnableApm: "false"
  Datadog__EnableRuntimeMetrics: "false"
  Datadog__EnableLlmObs: "false"
  Observability__Enabled: "false"
  Observability__OtlpEndpoint: ""
  Observability__Env: ${DD_ENV:-local}
  Observability__Version: ${DD_VERSION:-0.0.0}
  Observability__EnableTracing: "false"
  Observability__EnableMetrics: "false"
  Observability__EnableRuntimeMetrics: "false"
  DD_LLMOBS_ENABLED: "false"

x-datadog-env-off: &datadog-env-off
  Datadog__Enabled: "false"
  Datadog__ApiKey: ""
  Datadog__Site: ${DD_SITE:-datadoghq.com}
  Datadog__AgentHost: ""
  Datadog__AgentPort: "8126"
  Datadog__DogStatsDPort: "8125"
  Datadog__Env: ${DD_ENV:-local}
  Datadog__Version: ${DD_VERSION:-0.0.0}
  Datadog__EnableApm: "false"
  Datadog__EnableRuntimeMetrics: "false"
  Datadog__EnableLlmObs: "false"
  Observability__Enabled: "false"
  Observability__OtlpEndpoint: ""
  Observability__Env: ${DD_ENV:-local}
  Observability__Version: ${DD_VERSION:-0.0.0}
  Observability__EnableTracing: "false"
  Observability__EnableMetrics: "false"
  Observability__EnableRuntimeMetrics: "false"
  DD_LLMOBS_ENABLED: "false"

# ASPNETCORE_ENVIRONMENT is set here (orchestration), not in Dockerfiles — same image promotes across envs.
x-credential-consumer-env: &credential-consumer-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  SetupService__BaseUrl: http://setup-service:5004
  CredentialDistribution__InternalServiceKey: ${CREDENTIAL_DISTRIBUTION_KEY:-fgs-internal-credential-distribution-key}
  # Seed Redis for Redis-first credential bootstrap (snapshot published by Setup).
  Redis__ConnectionString: redis:6379
  Redis__Enabled: "true"
  # Production disables Swagger unless Enabled=true; without it /swagger/* falls through to JWT fallback (401).
  Swagger__Enabled: "true"
  <<: *datadog-env-off

x-depends-on-setup: &depends-on-setup
  setup-service:
    condition: service_healthy

x-depends-on-setup-and-audit: &depends-on-setup-and-audit
  setup-service:
    condition: service_healthy
  audit-service:
    condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    user: "100:101"
    environment:
      RABBITMQ_DEFAULT_USER: fgs
      RABBITMQ_DEFAULT_PASS: fgsdevlocal
      RABBITMQ_ERLANG_COOKIE: fgs-local-dev-cookie
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - fgs-private
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - fgs-private
    restart: unless-stopped

  # Datadog Agent — optional (profile). Local default is logs-only without this container.
  # Start with: docker compose --profile datadog-agent up -d datadog-agent
  # Then point Observability__OtlpEndpoint / Datadog__AgentHost at datadog-agent and set DD_API_KEY.
  datadog-agent:
    profiles: ["datadog-agent"]
    image: gcr.io/datadoghq/agent:7.64.0
    <<: *service-network
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-local}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "false"
      DD_PROCESS_AGENT_ENABLED: "false"
      DD_LLMOBS_ENABLED: "false"
      DD_HOSTNAME: fgs-local-datadog
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: "0.0.0.0:4317"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: "0.0.0.0:4318"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/var/log/nginx:ro
    expose:
      - "8126"
      - "8125"
      - "4317"
      - "4318"
    ports:
      - "127.0.0.1:8126:8126"
      - "127.0.0.1:8125:8125/udp"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  # Tier 1 ? credential authority (bootstrap ConnectionStrings:FgsSetup from mounted appsettings)
  setup-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/setup-service.Dockerfile
    environment:
      <<: *datadog-env-on
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      CredentialDistribution__InternalServiceKey: ${CREDENTIAL_DISTRIBUTION_KEY:-fgs-internal-credential-distribution-key}
      Swagger__Enabled: "true"
      Swagger__RoutePrefix: swagger/setup
      UserService__BaseUrl: http://user-service:5001
      FileService__BaseUrl: http://file-service:5005
      RabbitMq__HostName: rabbitmq
      Redis__ConnectionString: redis:6379
      Redis__Enabled: "true"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../SetupService/Fgs.Setup.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5004"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://setup-service:5004/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Tier 2 ? credential consumers (Setup must be healthy before these start)
  audit-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/audit-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/audit
      CredentialConsumer__ServiceName: fgs-audit-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      RabbitMq__HostName: rabbitmq
    depends_on:
      <<: *depends-on-setup
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../AuditService/Fgs.Audit.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5008"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://audit-service:5008/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  user-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/user-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      # Override shared off defaults — Datadog logs-only for user-service (with setup-service).
      Datadog__Enabled: "true"
      Datadog__ApiKey: ${DD_API_KEY:-}
      Datadog__AgentHost: ""
      Datadog__EnableApm: "false"
      Datadog__EnableRuntimeMetrics: "false"
      Datadog__EnableLlmObs: "false"
      Observability__Enabled: "false"
      Observability__OtlpEndpoint: ""
      Observability__EnableTracing: "false"
      Observability__EnableMetrics: "false"
      Observability__EnableRuntimeMetrics: "false"
      DD_LLMOBS_ENABLED: "false"
      Swagger__RoutePrefix: swagger/user
      CredentialConsumer__ServiceName: fgs-user-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: ENTRA_EXTERNAL_ID
      CredentialConsumer__RequiredProviders__2: AWS
      CredentialConsumer__RequiredProviders__3: REDIS
      CredentialConsumer__RequiredProviders__4: RABBITMQ
      RabbitMq__HostName: rabbitmq
      # Local gateway public origin (invite / API deep links). Flat /api/v1/... (no service prefix).
      Application__PublicBaseUrl: ${FGS_PUBLIC_BASE_URL:-https://developer.fsm.com}
      Application__PublicServicePath: ${FGS_PUBLIC_SERVICE_PATH:-}
      # SPA Entra OAuth callback (override via .env / shell; must match Entra redirect URI).
      Application__UiAuthCallbackUrl: ${FGS_UI_AUTH_CALLBACK_URL:-https://developer.fsm.com/auth/callback}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      <<: *depends-on-setup-and-audit
    volumes:
      - ../UserService/Fgs.User.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://user-service:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Stateless BFF ? scale with: docker compose up --scale bff-service=N
  bff-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/bff-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/bff
      CredentialConsumer__ServiceName: fgs-bff-service
      CredentialConsumer__RequiredProviders__0: ENTRA_EXTERNAL_ID
      CredentialConsumer__RequiredProviders__1: REDIS
      UserService__BaseUrl: http://user-service:5001
      SetupService__BaseUrl: http://setup-service:5004
      Redis__ConnectionString: redis:6379
      Redis__Enabled: "true"
    depends_on:
      redis:
        condition: service_healthy
      <<: *depends-on-setup-and-audit
      user-service:
        condition: service_healthy
    volumes:
      - ../BffService/Fgs.Bff.API/appsettings.json:/app/appsettings.json:ro
    ports:
      - "127.0.0.1:5003:5003"
    expose:
      - "5003"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://bff-service:5003/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  file-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/file-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/file
      CredentialConsumer__ServiceName: fgs-file-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: AWS
      UserService__BaseUrl: http://user-service:5001
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../FileService/Fgs.File.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5005"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://file-service:5005/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  inventory-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/inventory-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/inventory
      CredentialConsumer__ServiceName: fgs-inventory-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: REDIS
      CredentialConsumer__RequiredProviders__2: RABBITMQ
      RabbitMq__HostName: rabbitmq
      UserService__BaseUrl: http://user-service:5001
      SetupService__BaseUrl: http://setup-service:5004
      Redis__ConnectionString: redis:6379
      Redis__Enabled: "true"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      <<: *depends-on-setup-and-audit
    volumes:
      - ../InventoryService/Fgs.Inventory.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5012"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5012/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  asset-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/asset-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/asset
      CredentialConsumer__ServiceName: fgs-asset-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: REDIS
      UserService__BaseUrl: http://user-service:5001
      SetupService__BaseUrl: http://setup-service:5004
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../AssetService/Fgs.Asset.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5015"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5015/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  service-agreement-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/service-agreement-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/service-agreement
      CredentialConsumer__ServiceName: fgs-service-agreement-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      UserService__BaseUrl: http://user-service:5001
      SetupService__BaseUrl: http://setup-service:5004
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../ServiceAgreementService/Fgs.ServiceAgreement.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5016"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5016/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  crm-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/crm-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/crm
      CredentialConsumer__ServiceName: fgs-crm-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      UserService__BaseUrl: http://user-service:5001
      SetupService__BaseUrl: http://setup-service:5004
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../CrmService/Fgs.Crm.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5009"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://crm-service:5009/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  scheduling-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/scheduling-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/scheduling
      CredentialConsumer__ServiceName: fgs-scheduling-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      UserService__BaseUrl: http://user-service:5001
      SetupService__BaseUrl: http://setup-service:5004
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../SchedulingService/Fgs.Scheduling.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5010/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  billing-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/billing-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/billing
      CredentialConsumer__ServiceName: fgs-billing-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      UserService__BaseUrl: http://user-service:5001
      SetupService__BaseUrl: http://setup-service:5004
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../BillingService/Fgs.Billing.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5011"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5011/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  notification-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/notification-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/notification
      CredentialConsumer__ServiceName: fgs-notification-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: SENDGRID
      UserService__BaseUrl: http://user-service:5001
      RabbitMq__HostName: rabbitmq
    depends_on:
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../NotificationService/Fgs.Notification.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://notification-service:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Tier 3 — messaging workers
  consumer-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/consumer-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/consumer
      CredentialConsumer__ServiceName: fgs-consumer-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: RABBITMQ
      UserService__BaseUrl: http://user-service:5001
      # appsettings.Development.json uses localhost:5084 for host-run; override for Docker DNS.
      NotificationService__BaseUrl: http://notification-service:5002
      RabbitMq__HostName: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    volumes:
      - ../ConsumerService/Fgs.Consumer.API/appsettings.json:/app/appsettings.json:ro
    expose:
      - "5007"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://consumer-service:5007/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Tier 4 ? public gateway
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      bff-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      asset-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      scheduling-service:
        condition: service_healthy
      service-agreement-service:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
      - ./cache:/var/cache/nginx
    networks:
      - fgs-private
      - fgs-edge
    restart: unless-stopped

networks:
  fgs-private:
    driver: bridge
  fgs-edge:
    driver: bridge

volumes:
  rabbitmq-data:
  redis-data:
