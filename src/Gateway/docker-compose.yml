name: fgs-local

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    # Run as rabbitmq (uid 100) so .erlang.cookie is created with correct ownership.
    # Do not use tmpfs with uid/gid on Docker Desktop for Windows — it often causes EACCES.
    user: "100:101"
    environment:
      RABBITMQ_DEFAULT_USER: fgs
      RABBITMQ_DEFAULT_PASS: fgsdevlocal
      RABBITMQ_ERLANG_COOKIE: fgs-local-dev-cookie
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - fgs-private
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      user-service:
        condition: service_healthy
      platform-service:
        condition: service_healthy
      workorder-service:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
      - ./cache:/var/cache/nginx
    networks:
      - fgs-private
      - fgs-edge
    restart: unless-stopped

  user-service:
    build:
      context: ../..
      dockerfile: src/Gateway/docker/user-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__HostName: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../UserService/Fgs.User.API/appsettings.json:/src/src/UserService/Fgs.User.API/appsettings.json:ro
      - ../UserService/Fgs.User.API/appsettings.Development.json:/src/src/UserService/Fgs.User.API/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5001"
    networks:
      - fgs-private
    restart: unless-stopped

  platform-service:
    build:
      context: ../..
      dockerfile: src/Gateway/docker/platform-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__HostName: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../PlatformService/Fgs.Platform.API/appsettings.json:/src/src/PlatformService/Fgs.Platform.API/appsettings.json:ro
      - ../PlatformService/Fgs.Platform.API/appsettings.Development.json:/src/src/PlatformService/Fgs.Platform.API/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5002"
    networks:
      - fgs-private
    restart: unless-stopped

  workorder-service:
    build:
      context: ../..
      dockerfile: src/Gateway/docker/workorder-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ../WorkOrderService/Fgs.WorkOrder.API/appsettings.json:/src/src/WorkOrderService/Fgs.WorkOrder.API/appsettings.json:ro
      - ../WorkOrderService/Fgs.WorkOrder.API/appsettings.Development.json:/src/src/WorkOrderService/Fgs.WorkOrder.API/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5003"
    networks:
      - fgs-private
    restart: unless-stopped

networks:
  fgs-private:
    driver: bridge
  fgs-edge:
    driver: bridge

volumes:
  rabbitmq-data:
