name: fgs-local

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    # Run as rabbitmq (uid 100) so .erlang.cookie is created with correct ownership.
    # Do not use tmpfs with uid/gid on Docker Desktop for Windows — it often causes EACCES.
    user: "100:101"
    environment:
      RABBITMQ_DEFAULT_USER: fgs
      RABBITMQ_DEFAULT_PASS: fgsdevlocal
      RABBITMQ_ERLANG_COOKIE: fgs-local-dev-cookie
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - fgs-private
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      setup-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
      - ./cache:/var/cache/nginx
    networks:
      - fgs-private
      - fgs-edge
    restart: unless-stopped

  user-service:
    build:
      context: ../..
      dockerfile: src/Gateway/docker/user-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ../UserService/Fgs.User.API/appsettings.json:/src/src/UserService/Fgs.User.API/appsettings.json:ro
      - ../UserService/Fgs.User.API/appsettings.Development.json:/src/src/UserService/Fgs.User.API/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5001"
    networks:
      - fgs-private
    restart: unless-stopped

  notification-service:
    build:
      context: ../..
      dockerfile: src/Gateway/docker/notification-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SetupService__BaseUrl: http://setup-service:5003
    depends_on:
      user-service:
        condition: service_started
    volumes:
      - ../NotificationService/Fgs.Notification.API/appsettings.json:/src/src/NotificationService/Fgs.Notification.API/appsettings.json:ro
      - ../NotificationService/Fgs.Notification.API/appsettings.Development.json:/src/src/NotificationService/Fgs.Notification.API/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5002"
    networks:
      - fgs-private
    restart: unless-stopped

  job-service:
    build:
      context: ../..
      dockerfile: src/Gateway/docker/job-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ../JobService/Fgs.Job.API/appsettings.json:/src/src/JobService/Fgs.Job.API/appsettings.json:ro
      - ../JobService/Fgs.Job.API/appsettings.Development.json:/src/src/JobService/Fgs.Job.API/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5003"
    networks:
      - fgs-private
    restart: unless-stopped

  file-service:
    build:
      context: ../..
      dockerfile: src/Gateway/docker/file-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ../FileService/Fgs.File.API/appsettings.json:/src/src/FileService/Fgs.File.API/appsettings.json:ro
      - ../FileService/Fgs.File.API/appsettings.Development.json:/src/src/FileService/Fgs.File.API/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5005"
    networks:
      - fgs-private
    restart: unless-stopped

  setup-service:
    build:
      context: ../..
      dockerfile: src/Gateway/docker/setup-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FileService__BaseUrl: http://file-service:5005
      UserService__BaseUrl: http://user-service:5001
    depends_on:
      user-service:
        condition: service_started
      file-service:
        condition: service_healthy
    volumes:
      - ../SetupService/Fgs.Setup.API/appsettings.json:/src/src/SetupService/Fgs.Setup.API/appsettings.json:ro
      - ../SetupService/Fgs.Setup.API/appsettings.Development.json:/src/src/SetupService/Fgs.Setup.API/appsettings.Development.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5004"
    networks:
      - fgs-private
    restart: unless-stopped

networks:
  fgs-private:
    driver: bridge
  fgs-edge:
    driver: bridge

volumes:
  rabbitmq-data:
