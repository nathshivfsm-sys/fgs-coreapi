name: fgs-local

# Startup order:
#   1. rabbitmq, redis
#   2. setup-service  — credential authority
#   3. audit-service starts first among consumers, then other credential consumers
#   4. publisher / consumer — messaging workers
#   5. nginx — public gateway after upstream health checks pass

x-service-network: &service-network
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - fgs-private
  restart: unless-stopped

x-credential-consumer-env: &credential-consumer-env
  ASPNETCORE_ENVIRONMENT: Development
  SetupService__BaseUrl: http://setup-service:5004
  CredentialDistribution__InternalServiceKey: fgs-internal-credential-distribution-key

x-depends-on-setup: &depends-on-setup
  setup-service:
    condition: service_healthy

x-depends-on-setup-and-audit: &depends-on-setup-and-audit
  setup-service:
    condition: service_healthy
  audit-service:
    condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    user: "100:101"
    environment:
      RABBITMQ_DEFAULT_USER: fgs
      RABBITMQ_DEFAULT_PASS: fgsdevlocal
      RABBITMQ_ERLANG_COOKIE: fgs-local-dev-cookie
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - fgs-private
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - fgs-private
    restart: unless-stopped

  # Tier 1 — credential authority (bootstrap ConnectionStrings:FgsSetup from mounted appsettings)
  setup-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/setup-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Swagger__RoutePrefix: swagger/setup
      UserService__BaseUrl: http://user-service:5001
      FileService__BaseUrl: http://file-service:5005
      RabbitMq__HostName: rabbitmq
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../SetupService/Fgs.Setup.API/appsettings.json:/src/src/SetupService/Fgs.Setup.API/appsettings.json:ro
      - ../SetupService/Fgs.Setup.API/appsettings.Development.json:/src/src/SetupService/Fgs.Setup.API/appsettings.Development.json:ro
    expose:
      - "5004"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5004/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Tier 2 — credential consumers (Setup must be healthy before these start)
  audit-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/audit-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/audit
      CredentialConsumer__ServiceName: fgs-audit-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      RabbitMq__HostName: rabbitmq
    depends_on:
      <<: *depends-on-setup
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../AuditService/Fgs.Audit.API/appsettings.json:/src/src/AuditService/Fgs.Audit.API/appsettings.json:ro
      - ../AuditService/Fgs.Audit.API/appsettings.Development.json:/src/src/AuditService/Fgs.Audit.API/appsettings.Development.json:ro
    expose:
      - "5008"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5008/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  user-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/user-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/user
      CredentialConsumer__ServiceName: fgs-user-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: ENTRA_EXTERNAL_ID
      CredentialConsumer__RequiredProviders__2: AWS
      CredentialConsumer__RequiredProviders__3: REDIS
    depends_on:
      redis:
        condition: service_healthy
      <<: *depends-on-setup-and-audit
    volumes:
      - ../UserService/Fgs.User.API/appsettings.json:/src/src/UserService/Fgs.User.API/appsettings.json:ro
      - ../UserService/Fgs.User.API/appsettings.Development.json:/src/src/UserService/Fgs.User.API/appsettings.Development.json:ro
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Stateless BFF — scale with: docker compose up --scale bff-service=N
  bff-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/bff-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/bff
      CredentialConsumer__ServiceName: fgs-bff-service
      CredentialConsumer__RequiredProviders__0: ENTRA_EXTERNAL_ID
      CredentialConsumer__RequiredProviders__1: REDIS
      UserService__BaseUrl: http://user-service:5001
      SetupService__BaseUrl: http://setup-service:5004
      Redis__ConnectionString: redis:6379
      Redis__Enabled: "true"
    depends_on:
      redis:
        condition: service_healthy
      <<: *depends-on-setup-and-audit
      user-service:
        condition: service_healthy
    volumes:
      - ../BffService/Fgs.Bff.API/appsettings.json:/src/src/BffService/Fgs.Bff.API/appsettings.json:ro
      - ../BffService/Fgs.Bff.API/appsettings.Development.json:/src/src/BffService/Fgs.Bff.API/appsettings.Development.json:ro
    ports:
      - "127.0.0.1:5003:5003"
    expose:
      - "5003"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5003/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  file-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/file-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/file
      CredentialConsumer__ServiceName: fgs-file-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: AWS
      UserService__BaseUrl: http://user-service:5001
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../FileService/Fgs.File.API/appsettings.json:/src/src/FileService/Fgs.File.API/appsettings.json:ro
      - ../FileService/Fgs.File.API/appsettings.Development.json:/src/src/FileService/Fgs.File.API/appsettings.Development.json:ro
    expose:
      - "5005"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5005/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  inventory-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/inventory-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/inventory
      CredentialConsumer__ServiceName: fgs-inventory-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: REDIS
      UserService__BaseUrl: http://user-service:5001
      SetupService__BaseUrl: http://setup-service:5004
      Redis__ConnectionString: redis:6379
      Redis__Enabled: "true"
    depends_on:
      redis:
        condition: service_healthy
      <<: *depends-on-setup-and-audit
    volumes:
      - ../InventoryService/Fgs.Inventory.API/appsettings.json:/src/src/InventoryService/Fgs.Inventory.API/appsettings.json:ro
      - ../InventoryService/Fgs.Inventory.API/appsettings.Development.json:/src/src/InventoryService/Fgs.Inventory.API/appsettings.Development.json:ro
    expose:
      - "5012"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5012/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  asset-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/asset-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/asset
      CredentialConsumer__ServiceName: fgs-asset-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: REDIS
      UserService__BaseUrl: http://user-service:5001
      SetupService__BaseUrl: http://setup-service:5004
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../AssetService/Fgs.Asset.API/appsettings.json:/src/src/AssetService/Fgs.Asset.API/appsettings.json:ro
      - ../AssetService/Fgs.Asset.API/appsettings.Development.json:/src/src/AssetService/Fgs.Asset.API/appsettings.Development.json:ro
    expose:
      - "5015"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5015/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  notification-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/notification-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/notification
      CredentialConsumer__ServiceName: fgs-notification-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: SENDGRID
      UserService__BaseUrl: http://user-service:5001
      RabbitMq__HostName: rabbitmq
    depends_on:
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../NotificationService/Fgs.Notification.API/appsettings.json:/src/src/NotificationService/Fgs.Notification.API/appsettings.json:ro
      - ../NotificationService/Fgs.Notification.API/appsettings.Development.json:/src/src/NotificationService/Fgs.Notification.API/appsettings.Development.json:ro
    expose:
      - "5002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Tier 3 — messaging workers
  publisher-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/publisher-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/publisher
      CredentialConsumer__ServiceName: fgs-publisher-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: RABBITMQ
      RabbitMq__HostName: rabbitmq
      UserService__BaseUrl: http://user-service:5001
    depends_on:
      rabbitmq:
        condition: service_healthy
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    volumes:
      - ../PublisherService/Fgs.Publisher.API/appsettings.json:/src/src/PublisherService/Fgs.Publisher.API/appsettings.json:ro
      - ../PublisherService/Fgs.Publisher.API/appsettings.Development.json:/src/src/PublisherService/Fgs.Publisher.API/appsettings.Development.json:ro
    expose:
      - "5006"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5006/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  consumer-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/consumer-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      Swagger__RoutePrefix: swagger/consumer
      CredentialConsumer__ServiceName: fgs-consumer-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: RABBITMQ
      UserService__BaseUrl: http://user-service:5001
      RabbitMq__HostName: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    volumes:
      - ../ConsumerService/Fgs.Consumer.API/appsettings.json:/src/src/ConsumerService/Fgs.Consumer.API/appsettings.json:ro
      - ../ConsumerService/Fgs.Consumer.API/appsettings.Development.json:/src/src/ConsumerService/Fgs.Consumer.API/appsettings.Development.json:ro
    expose:
      - "5007"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5007/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Tier 4 — public gateway
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      bff-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      asset-service:
        condition: service_healthy
    ports:
      - "8080:80"
      - "443:443"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
      - ./cache:/var/cache/nginx
    networks:
      - fgs-private
      - fgs-edge
    restart: unless-stopped

networks:
  fgs-private:
    driver: bridge
  fgs-edge:
    driver: bridge

volumes:
  rabbitmq-data:
  redis-data:
