    volumes:
      - ../ReportingService/Fgs.Reporting.API/appsettings.json:/src/src/ReportingService/Fgs.Reporting.API/appsettings.json:ro
      - ../ReportingService/Fgs.Reporting.API/appsettings.Development.json:/src/src/ReportingService/Fgs.Reporting.API/appsettings.Development.json:ro
    expose:
      - "5013"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5013/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  integration-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/integration-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-integration-service
      CredentialConsumer__RequiredProviders__0: DATABASE
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../IntegrationService/Fgs.Integration.API/appsettings.json:/src/src/IntegrationService/Fgs.Integration.API/appsettings.json:ro
      - ../IntegrationService/Fgs.Integration.API/appsettings.Development.json:/src/src/IntegrationService/Fgs.Integration.API/appsettings.Development.json:ro
    expose:
      - "5014"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5014/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  asset-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/asset-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-asset-service
      CredentialConsumer__RequiredProviders__0: DATABASE
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../AssetService/Fgs.Asset.API/appsettings.json:/src/src/AssetService/Fgs.Asset.API/appsettings.json:ro
      - ../AssetService/Fgs.Asset.API/appsettings.Development.json:/src/src/AssetService/Fgs.Asset.API/appsettings.Development.json:ro
    expose:
      - "5015"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5015/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  service-agreement-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/service-agreement-service.Dockerfile
    environment:
