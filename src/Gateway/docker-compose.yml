name: fgs-local

# Startup order (credential consolidation):
#   1. rabbitmq
#   2. setup-service  — credential authority (audit disabled locally; see AuditService__Enabled)
#   3. audit-service starts first among consumers, then other credential consumers
#   4. publisher / consumer — messaging workers
#   5. nginx — public gateway after upstream health checks pass

x-service-network: &service-network
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - fgs-private
  restart: unless-stopped

x-credential-consumer-env: &credential-consumer-env
  ASPNETCORE_ENVIRONMENT: Development
  SetupService__BaseUrl: http://setup-service:5004
  CredentialDistribution__InternalServiceKey: fgs-internal-credential-distribution-key

x-depends-on-setup: &depends-on-setup
  setup-service:
    condition: service_healthy

x-depends-on-setup-and-audit: &depends-on-setup-and-audit
  setup-service:
    condition: service_healthy
  audit-service:
    condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    user: "100:101"
    environment:
      RABBITMQ_DEFAULT_USER: fgs
      RABBITMQ_DEFAULT_PASS: fgsdevlocal
      RABBITMQ_ERLANG_COOKIE: fgs-local-dev-cookie
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - fgs-private
    restart: unless-stopped

  # Tier 1 — credential authority (bootstrap ConnectionStrings:FgsSetup from mounted appsettings)
  setup-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/setup-service.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      UserService__BaseUrl: http://user-service:5001
      FileService__BaseUrl: http://file-service:5005
      AuditService__BaseUrl: http://audit-service:5008
      # Setup starts before audit is listening; disable credential audit in local Compose to avoid connection-refused noise.
      AuditService__Enabled: "false"
    volumes:
      - ../SetupService/Fgs.Setup.API/appsettings.json:/src/src/SetupService/Fgs.Setup.API/appsettings.json:ro
      - ../SetupService/Fgs.Setup.API/appsettings.Development.json:/src/src/SetupService/Fgs.Setup.API/appsettings.Development.json:ro
    expose:
      - "5004"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5004/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Tier 2 — credential consumers (Setup must be healthy before these start)
  audit-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/audit-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-audit-service
      CredentialConsumer__RequiredProviders__0: DATABASE
    depends_on:
      <<: *depends-on-setup
    volumes:
      - ../AuditService/Fgs.Audit.API/appsettings.json:/src/src/AuditService/Fgs.Audit.API/appsettings.json:ro
      - ../AuditService/Fgs.Audit.API/appsettings.Development.json:/src/src/AuditService/Fgs.Audit.API/appsettings.Development.json:ro
    expose:
      - "5008"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5008/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  user-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/user-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-user-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: ENTRA_EXTERNAL_ID
      CredentialConsumer__RequiredProviders__2: AWS
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../UserService/Fgs.User.API/appsettings.json:/src/src/UserService/Fgs.User.API/appsettings.json:ro
      - ../UserService/Fgs.User.API/appsettings.Development.json:/src/src/UserService/Fgs.User.API/appsettings.Development.json:ro
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  file-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/file-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-file-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: AWS
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../FileService/Fgs.File.API/appsettings.json:/src/src/FileService/Fgs.File.API/appsettings.json:ro
      - ../FileService/Fgs.File.API/appsettings.Development.json:/src/src/FileService/Fgs.File.API/appsettings.Development.json:ro
    expose:
      - "5005"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5005/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  notification-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/notification-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-notification-service
      CredentialConsumer__RequiredProviders__0: DATABASE
      CredentialConsumer__RequiredProviders__1: SENDGRID
      UserService__BaseUrl: http://user-service:5001
    depends_on:
      setup-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    volumes:
      - ../NotificationService/Fgs.Notification.API/appsettings.json:/src/src/NotificationService/Fgs.Notification.API/appsettings.json:ro
      - ../NotificationService/Fgs.Notification.API/appsettings.Development.json:/src/src/NotificationService/Fgs.Notification.API/appsettings.Development.json:ro
    expose:
      - "5002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  crm-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/crm-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-crm-service
      CredentialConsumer__RequiredProviders__0: DATABASE
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../CrmService/Fgs.Crm.API/appsettings.json:/src/src/CrmService/Fgs.Crm.API/appsettings.json:ro
      - ../CrmService/Fgs.Crm.API/appsettings.Development.json:/src/src/CrmService/Fgs.Crm.API/appsettings.Development.json:ro
    expose:
      - "5009"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5009/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  scheduling-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/scheduling-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-scheduling-service
      CredentialConsumer__RequiredProviders__0: DATABASE
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../SchedulingService/Fgs.Scheduling.API/appsettings.json:/src/src/SchedulingService/Fgs.Scheduling.API/appsettings.json:ro
      - ../SchedulingService/Fgs.Scheduling.API/appsettings.Development.json:/src/src/SchedulingService/Fgs.Scheduling.API/appsettings.Development.json:ro
    expose:
      - "5010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5010/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  billing-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/billing-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-billing-service
      CredentialConsumer__RequiredProviders__0: DATABASE
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../BillingService/Fgs.Billing.API/appsettings.json:/src/src/BillingService/Fgs.Billing.API/appsettings.json:ro
      - ../BillingService/Fgs.Billing.API/appsettings.Development.json:/src/src/BillingService/Fgs.Billing.API/appsettings.Development.json:ro
    expose:
      - "5011"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5011/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  inventory-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/inventory-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-inventory-service
      CredentialConsumer__RequiredProviders__0: DATABASE
    depends_on:
      <<: *depends-on-setup-and-audit
    volumes:
      - ../InventoryService/Fgs.Inventory.API/appsettings.json:/src/src/InventoryService/Fgs.Inventory.API/appsettings.json:ro
      - ../InventoryService/Fgs.Inventory.API/appsettings.Development.json:/src/src/InventoryService/Fgs.Inventory.API/appsettings.Development.json:ro
    expose:
      - "5012"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5012/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  reporting-service:
    <<: *service-network
    build:
      context: ../..
      dockerfile: src/Gateway/docker/reporting-service.Dockerfile
    environment:
      <<: *credential-consumer-env
      CredentialConsumer__ServiceName: fgs-reporting-service
      CredentialConsumer__RequiredProviders__0: DATABASE
    depends_on:
