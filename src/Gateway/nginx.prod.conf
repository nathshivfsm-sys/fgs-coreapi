user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format microservice_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"correlation_id":"$correlation_id",'
        '"host":"$host",'
        '"request":"$request",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"cache_status":"$upstream_cache_status",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log microservice_json buffer=64k flush=5s;

    sendfile                 on;
    tcp_nopush               on;
    tcp_nodelay              on;
    aio                      threads;
    keepalive_timeout        30s;
    keepalive_requests       10000;
    reset_timedout_connection on;

    client_body_timeout      15s;
    client_header_timeout    15s;
    send_timeout             30s;
    client_body_buffer_size  256k;
    client_max_body_size     10m;
    large_client_header_buffers 4 16k;

    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/problem+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        text/css
        text/plain
        text/xml;

    proxy_cache_path /var/cache/nginx/api
        levels=1:2
        keys_zone=api_cache:256m
        max_size=5g
        inactive=60m
        use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=api_rate_limit:20m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:20m;

    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    map $request_method $skip_non_get_cache {
        default 1;
        GET     0;
        HEAD    0;
    }

    map $request_uri $bad_request_uri {
        default 0;
        ~*\.\. 1;
        ~*(/\.git|/\.env|/wp-admin|/wp-login|/phpmyadmin|/vendor/phpunit) 1;
        ~*(<script|%3Cscript|union(\s|%20)+select|select(\s|%20)+.*from) 1;
    }

    include /etc/nginx/conf.d/*.conf;
}
