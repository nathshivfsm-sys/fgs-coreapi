include /etc/nginx/conf.d/includes/upstreams.conf;

server {
    listen 80;
    server_name developer.fsm.com localhost;

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name developer.fsm.com localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($bad_request_uri) {
        return 444;
    }

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = / {
        default_type text/plain;
        return 200 'FGS local gateway. API routes under /api/v1/... Swagger index: /swagger/ (per-service UI at /swagger/{service}/). See conf.d/includes/api-v1-routes.conf.';
    }

    include /etc/nginx/conf.d/includes/api-v1-routes.conf;
    include /etc/nginx/conf.d/includes/swagger-routes.conf;
}
