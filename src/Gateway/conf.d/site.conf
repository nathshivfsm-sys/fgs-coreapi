upstream user_service {
    least_conn;
    server user-service:5001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream notification_service {
    least_conn;
    server notification-service:5002 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream job_service {
    least_conn;
    server job-service:5003 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($bad_request_uri) {
        return 444;
    }

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = / {
        default_type text/plain;
        return 200 'FGS local gateway. Use /nginx-health, /api/v1/auth/, /api/v1/dashboard, /api/v1/invite/, /api/v1/signup/, /api/v1/users/, /api/v1/notifications/, or /api/v1/jobs/ (see src/Gateway/README.md).';
    }

    location = /api/v1/auth {
        return 308 /api/v1/auth/;
    }

    location /api/v1/auth/ {
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=api_rate_limit burst=30 nodelay;
        limit_conn addr_conn_limit 40;
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/auth;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/v1/invite {
        return 308 /api/v1/invite/;
    }

    location /api/v1/invite/ {
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=api_rate_limit burst=30 nodelay;
        limit_conn addr_conn_limit 40;
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/invite;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location /api/v1/dashboard {
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=api_rate_limit burst=30 nodelay;
        limit_conn addr_conn_limit 40;
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/dashboard;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/v1/signup {
        return 308 /api/v1/signup/;
    }

    location /api/v1/signup/ {
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=api_rate_limit burst=30 nodelay;
        limit_conn addr_conn_limit 40;
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/signup;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/v1/users {
        return 308 /api/v1/users/;
    }

    location /api/v1/users/ {
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=api_rate_limit burst=30 nodelay;
        limit_conn addr_conn_limit 40;
        rewrite ^/api/v1/users/?(.*)$ /api/v1/$1 break;
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/users;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/v1/notifications {
        return 308 /api/v1/notifications/;
    }

    location /api/v1/notifications/ {
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=api_rate_limit burst=30 nodelay;
        limit_conn addr_conn_limit 40;
        rewrite ^/api/v1/notifications/?(.*)$ /api/v1/$1 break;
        proxy_pass http://notification_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/notifications;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/v1/jobs {
        return 308 /api/v1/jobs/;
    }

    location /api/v1/jobs/ {
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=api_rate_limit burst=30 nodelay;
        limit_conn addr_conn_limit 40;
        rewrite ^/api/v1/jobs/?(.*)$ /api/v1/$1 break;
        proxy_pass http://job_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/jobs;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }
}

