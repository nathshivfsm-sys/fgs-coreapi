# --- Setup Service — S2S-only routes denied ---
location = /setup-service/api/v1/credential/resolved {
    return 403;
}

location ~ ^/setup-service/api/v1/tenantprovisioning(/|$) {
    return 403;
}

location ~ ^/setup-service/api/v1/(billingcategory|businesstype|communicationtemplate|credential|employee|glbreak|jobcategory|jobtypecategory|jobtype|jobtypetask|leaddisqualificationreason|leadsource|leadstatus|laborratetype|nonworkingdate|paymentmethod|paymentterm|postalcode|pricebook|pricebookitem|pricingmatrix|pricingmatrixlabor|pricingmatrixlabortier|pricingmatrixmaterialtier|pricingmatrixother|resolutioncode|salesactivityoutcome|salesactivitytype|salesdispositionreason|salespipelinestatus|setupdescription|tag|taxauthority|tax|techskilllevel|techtrade|timeslot|titleofcourtesy|universalmatrixaddon|universalmatrixfrequencydiscount|universalmatrixitem|universalmatrixonetimefee|universalmatrixsizetier|universalmatrixtier|universalpricingservice|vehiclemaintenance|vehicle|zone)(/|$) {
    rewrite ^/setup-service/(.*)$ /$1 break;
    proxy_pass http://setup_service;
    proxy_set_header X-Forwarded-Prefix /setup-service/api/v1/$1;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}
