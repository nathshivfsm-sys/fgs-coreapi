# Service-prefixed public API URLs (EC2 / production gateway only — not loaded for local Docker Desktop).
# Nginx strips the service prefix before proxying; ASP.NET apps still receive /api/v1/...
# Flat /api/v1/... routes remain for backward compatibility (OAuth callbacks, existing clients).
#
# Examples:
#   /setup-service/api/v1/billingcategory/lookup  → setup-service:5004
#   /user-service/api/v1/user/lookup                → user-service:5001
#   /bff-service/api/v1/bff/signup                  → bff-service:5003

# --- User Service (fgs-user-service) ---
location ~ ^/user-service/api/v1/internal/users(/|$) {
    return 403;
}

location ~ ^/user-service/api/v1/tenant/[0-9]+/companies/[0-9]+/businesstype(/|$) {
    return 403;
}

location ~ ^/user-service/api/v1/tenant/[0-9]+/bucket {
    return 403;
}

location = /user-service/api/v1/notification {
    return 403;
}

location /user-service/api/v1/notification/ {
    return 403;
}

location /user-service/api/v1/ {
    rewrite ^/user-service/(.*)$ /$1 break;
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /user-service/api/v1;
    include /etc/nginx/proxy_params.conf;
}

# --- BFF Service (fgs-bff-service) ---
location = /bff-service/api/v1/bff {
    return 308 /bff-service/api/v1/bff/;
}

location /bff-service/api/v1/ {
    rewrite ^/bff-service/(.*)$ /$1 break;
    proxy_pass http://bff_service;
    proxy_set_header X-Forwarded-Prefix /bff-service/api/v1;
    include /etc/nginx/proxy_params.conf;
}

# --- Notification Service — S2S only ---
location /notification-service/api/v1/ {
    return 403;
}

# --- File Service ---
