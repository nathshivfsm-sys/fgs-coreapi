# Setup Service — Fgs.Setup.API catalog controllers
location ~ ^/api/v1/(billingcategory|businesstype|communication-template|credential|glbreak|jobcategory|jobtypecategory|jobtype|jobtypetask|leaddisqualificationreason|leadsource|leadstatus|laborratetype|paymentmethod|paymentterm|postalcode|pricingmatrix|resolutioncode|salesactivityoutcome|salesactivitytype|salesdispositionreason|salespipelinestatus|setupdescription|tag|taxauthority|tax|techskilllevel|techtrade|tenant-provisioning|timeslot|titleofcourtesy|universalpricingservice|universalmatrixtier|universalmatrixsizetier|universalmatrixitem|universalmatrixfrequencydiscount|universalmatrixonetimefee|universalmatrixaddon|vehiclemaintenance|vehicle|zone)(/|$) {
