# Production API routes (no per-location rate limits; applied at server level in site.prod.conf)
# User Service — Fgs.User.API
location = /api/v1/auth {
    return 308 /api/v1/auth/;
}

location /api/v1/auth/ {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/auth;
    include /etc/nginx/proxy_params.conf;
}

# BFF — cross-domain orchestration only (company signup, future composites / GraphQL aggregation).
# Direct microservice CRUD routes below remain unchanged.
location = /api/v1/bff {
    return 308 /api/v1/bff/;
}

location /api/v1/bff/ {
    proxy_pass http://bff_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/bff;
    include /etc/nginx/proxy_params.conf;
}

location = /api/v1/login {
    return 308 /api/v1/login/;
}

location /api/v1/login/ {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/login;
    include /etc/nginx/proxy_params.conf;
}

# User Service — identity catalog / assignment / API management controllers
# Keep in sync with [FgsVersionedRoute] templates under Fgs.User.API/Controllers
location ~ ^/api/v1/(user|role|permission|dataaccess|dataaccessscope|userrole|rolepermission|roledataaccess|publicendpoint|apievent|apiclient|apisecret|apiwebhook|apiwebhooksubscription|servicesetup|serviceaccountssetup|company)(/|$) {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/$1;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

location ~ ^/api/v1/internal/users(/|$) {
    # S2S only — not exposed on the public gateway
    return 403;
}

location = /api/v1/invite {
    return 308 /api/v1/invite/;
}

location /api/v1/invite/ {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/invite;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

location /api/v1/dashboard {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/dashboard;
    include /etc/nginx/proxy_params.conf;
}

location = /api/v1/signup {
    return 308 /api/v1/signup/;
}

location /api/v1/signup/ {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/signup;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

location = /api/v1/tenant {
    return 308 /api/v1/tenant/;
}

# Company business-type bootstrap is S2S-only (BFF/Setup private network).
location ~ ^/api/v1/tenant/[0-9]+/companies/[0-9]+/businesstype(/|$) {
    return 403;
}

location ~ ^/api/v1/tenant/[0-9]+/bucket {
    # S2S only — File bucket provision is not public
    return 403;
}

location /api/v1/tenant/ {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/tenant;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

# Notification Service — S2S dispatch only (private Docker network; not public)
location = /api/v1/notification {
    return 403;
}

location /api/v1/notification/ {
    return 403;
}

# File Service — Fgs.File.API
location ~ ^/api/v1/attachment(/|$) {
    proxy_pass http://file_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/attachment;
    include /etc/nginx/proxy_params.conf;
}

# Audit Service — S2S credential audit write only (not public)
location ~ ^/api/v1/credentialaudit(/|$) {
    return 403;
}

# Inventory Service — Fgs.Inventory.API catalog controllers
# Keep in sync with [FgsVersionedRoute] templates under Fgs.Inventory.API/Controllers
location ~ ^/api/v1/(inventorycategory|inventoryitem|inventoryitemtype|inventorylocation|inventorystock|inventorysubcategory|inventorytransaction|purchaseorder|truckstocktemplate|vendor|vendorinventoryitem)(/|$) {
    proxy_pass http://inventory_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/$1;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

# Asset Service — Fgs.Asset.API catalog controllers
# Keep in sync with [FgsVersionedRoute] templates under Fgs.Asset.API/Controllers
location ~ ^/api/v1/(assettype|assetmanufacturer|assetstatus|assetmodel|assetattribute|assetattributeoption|asset|assetwarranty)(/|$) {
    proxy_pass http://asset_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/$1;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

# CRM Service — customer catalog
location ~ ^/api/v1/customer(/|$) {
    proxy_pass http://crm_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/customer;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

# Scheduling Service — appointment catalog
location ~ ^/api/v1/appointment(/|$) {
    proxy_pass http://scheduling_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/appointment;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

# Billing Service — invoice catalog
location ~ ^/api/v1/invoice(/|$) {
    proxy_pass http://billing_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/invoice;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

# Service Agreement Service — agreement catalog
location ~ ^/api/v1/serviceagreement(/|$) {
    proxy_pass http://service_agreement_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/serviceagreement;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

# Audit Service — S2S event/archive APIs (not public)
location ~ ^/api/v1/(event|archive)(/|$) {
    return 403;
}

# Setup Service — Fgs.Setup.API catalog controllers
# Keep in sync with [FgsVersionedRoute] templates under Fgs.Setup.API/Controllers
# S2S-only routes (tenantprovisioning, credential/resolved) are denied below.
location = /api/v1/credential/resolved {
    return 403;
}

location ~ ^/api/v1/tenantprovisioning(/|$) {
    return 403;
}

location ~ ^/api/v1/(billingcategory|businesstype|communicationtemplate|credential|employee|glbreak|jobcategory|jobtypecategory|jobtype|jobtypetask|leaddisqualificationreason|leadsource|leadstatus|laborratetype|nonworkingdate|paymentmethod|paymentterm|postalcode|pricingmatrix|pricingmatrixlabor|pricingmatrixlabortier|pricingmatrixmaterialtier|pricingmatrixother|resolutioncode|salesactivityoutcome|salesactivitytype|salesdispositionreason|salespipelinestatus|setupdescription|tag|taxauthority|tax|techskilllevel|techtrade|timeslot|titleofcourtesy|universalmatrixaddon|universalmatrixfrequencydiscount|universalmatrixitem|universalmatrixonetimefee|universalmatrixsizetier|universalmatrixtier|universalpricingservice|vehiclemaintenance|vehicle|zone)(/|$) {
    proxy_pass http://setup_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/$1;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}
