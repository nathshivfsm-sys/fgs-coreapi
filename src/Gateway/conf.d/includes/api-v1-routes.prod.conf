# Production API routes (no per-location rate limits; applied at server level in site.prod.conf)
# User Service — Fgs.User.API
location = /api/v1/auth {
    return 308 /api/v1/auth/;
}

location /api/v1/auth/ {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/auth;
    include /etc/nginx/proxy_params.conf;
}

# BFF — cross-domain orchestration only (company signup, future composites / GraphQL aggregation).
# Direct microservice CRUD routes below remain unchanged.
location = /api/v1/bff {
    return 308 /api/v1/bff/;
}

location /api/v1/bff/ {
    proxy_pass http://bff_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/bff;
    include /etc/nginx/proxy_params.conf;
}

location = /api/v1/login {
    return 308 /api/v1/login/;
}

location /api/v1/login/ {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/login;
    include /etc/nginx/proxy_params.conf;
}

# User Service — identity catalog / assignment / API management controllers
# Keep in sync with [FgsVersionedRoute] templates under Fgs.User.API/Controllers
location ~ ^/api/v1/(role|permission|dataaccess|dataaccessscope|userrole|rolepermission|roledataaccess|publicendpoint|apievent|apiclient|apisecret|apiwebhook|apiwebhooksubscription)(/|$) {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/$1;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

location ~ ^/api/v1/internal/users(/|$) {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/internal/users;
    include /etc/nginx/proxy_params.conf;
}

location = /api/v1/invite {
    return 308 /api/v1/invite/;
}

location /api/v1/invite/ {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/invite;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

location /api/v1/dashboard {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/dashboard;
    include /etc/nginx/proxy_params.conf;
}

location = /api/v1/signup {
    return 308 /api/v1/signup/;
}

location /api/v1/signup/ {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/signup;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

location = /api/v1/tenant {
    return 308 /api/v1/tenant/;
}

# Must precede the broader companies route below, which otherwise sends this to user_service.
location ~ ^/api/v1/tenant/[0-9]+/companies/[0-9]+/business-type(/|$) {
    proxy_pass http://setup_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/tenant;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

location ~ ^/api/v1/tenant/[0-9]+/companies {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/tenant;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

location ~ ^/api/v1/tenant/[0-9]+/bucket {
    proxy_pass http://file_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/tenant;
    include /etc/nginx/proxy_params.conf;
}

location /api/v1/tenant/ {
    proxy_pass http://user_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/tenant;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

