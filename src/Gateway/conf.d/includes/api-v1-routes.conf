# Inventory Service — Fgs.Inventory.API catalog controllers
# Keep in sync with [FgsVersionedRoute] templates under Fgs.Inventory.API/Controllers
location ~ ^/api/v1/(inventory-locations|vendors)(/|$) {
    include /etc/nginx/conf.d/includes/rate-limit.inc;
    proxy_pass http://inventory_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/$1;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}

# Setup Service — Fgs.Setup.API catalog controllers
# Keep in sync with [FgsVersionedRoute] templates under Fgs.Setup.API/Controllers
location ~ ^/api/v1/(billingcategories|businesstypes|communication-templates|credentials|glbreaks|jobtypecategories|jobtypes|jobtypesubcategories|leaddisqualificationreasons|leadsources|leadstatuses|laborratetypes|paymentmethods|paymentterms|postalcodes|resolutioncodes|salesactivityoutcomes|salesactivitytypes|salesdispositionreasons|salespipelinestatuses|setupdescriptions|tags|taxauthorities|taxes|techskilllevels|techtrades|tenant-provisioning|timeslots|titlesofcourtesy|vehiclemaintenances|vehicles|zones)(/|$) {
    include /etc/nginx/conf.d/includes/rate-limit.inc;
    proxy_pass http://setup_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/$1;
    include /etc/nginx/proxy_params.conf;
    include /etc/nginx/cache_params.conf;
}
