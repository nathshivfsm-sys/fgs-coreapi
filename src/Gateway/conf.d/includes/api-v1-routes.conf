# File Service — Fgs.File.API
location ~ ^/api/v1/attachment(/|$) {
    include /etc/nginx/conf.d/includes/rate-limit.inc;
    proxy_pass http://file_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/attachment;
    include /etc/nginx/proxy_params.conf;
