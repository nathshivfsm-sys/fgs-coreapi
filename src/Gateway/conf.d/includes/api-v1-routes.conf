# Audit Service — Fgs.Audit.API
location ~ ^/api/v1/credential-audits(/|$) {
    include /etc/nginx/conf.d/includes/rate-limit.inc;
    proxy_pass http://audit_service;
    proxy_set_header X-Forwarded-Prefix /api/v1/credential-audits;
    include /etc/nginx/proxy_params.conf;
