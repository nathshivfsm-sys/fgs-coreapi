server {
    listen 80;
    server_name fgs.example.com;

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name fgs.example.com;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req zone=api_rate_limit burst=60 nodelay;
    limit_conn addr_conn_limit 100;

    if ($bad_request_uri) {
        return 444;
    }

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = /api/v1/auth {
        return 308 /api/v1/auth/;
    }

    location /api/v1/auth/ {
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/auth;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/v1/invite {
        return 308 /api/v1/invite/;
    }

    location /api/v1/invite/ {
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/invite;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location /api/v1/dashboard {
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/dashboard;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/v1/signup {
        return 308 /api/v1/signup/;
    }

    location /api/v1/signup/ {
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/signup;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/v1/users {
        return 308 /api/v1/users/;
    }

    location /api/v1/users/ {
        rewrite ^/api/v1/users/?(.*)$ /api/v1/$1 break;
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/users;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/v1/notifications {
        return 308 /api/v1/notifications/;
    }

    location /api/v1/notifications/ {
        rewrite ^/api/v1/notifications/?(.*)$ /api/v1/$1 break;
        proxy_pass http://notification_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/notifications;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/v1/credentials {
        return 308 /api/v1/credentials/;
    }

    location /api/v1/credentials/ {
        proxy_pass http://setup_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/credentials;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/v1/communication-templates {
        return 308 /api/v1/communication-templates/;
    }

    location /api/v1/communication-templates/ {
        proxy_pass http://setup_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/communication-templates;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location = /api/v1/tenants {
        return 308 /api/v1/tenants/;
    }

    location ~ ^/api/v1/tenants/[0-9]+/companies {
        proxy_pass http://user_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/tenants;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/cache_params.conf;
    }

    location ~ ^/api/v1/tenants/[0-9]+/bucket {
        proxy_pass http://file_service;
        proxy_set_header X-Forwarded-Prefix /api/v1/tenants;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/v1/tenants/ {
