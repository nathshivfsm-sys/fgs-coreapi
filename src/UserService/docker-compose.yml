# Local RabbitMQ for User Service (Docker Desktop).
# Run from this folder: docker compose up -d
# AMQP: localhost:5672  |  Management UI: http://localhost:15672  (same credentials as below)
services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fgs-user-rabbitmq
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: fgs
      RABBITMQ_DEFAULT_PASS: fgsdevlocal
    volumes:
      - fgs_user_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s

volumes:
  fgs_user_rabbitmq_data:
