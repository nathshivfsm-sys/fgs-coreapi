# RabbitMQ only — for running Fgs.Notification.API on the host (see launchSettings.json).
# For the full stack (nginx, user, platform, workorder, postgres, rabbitmq), use:
#   cd src/Gateway && docker compose up --build
services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fgs-platform-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fgs
      RABBITMQ_DEFAULT_PASS: fgsdevlocal
      RABBITMQ_ERLANG_COOKIE: fgs-platform-dev-cookie
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    tmpfs:
      - /var/lib/rabbitmq:rw,nosuid,nodev,noexec,uid=100,gid=101,mode=0700
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
